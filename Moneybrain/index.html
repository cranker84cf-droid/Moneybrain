<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07145f">
  <title>Moneybrain</title>
  <link rel="manifest" href="manifest.webmanifest?v=53">
  <link rel="icon" type="image/png" sizes="192x192" href="moneybrain-icon-192.png?v=52">
  <link rel="apple-touch-icon" href="moneybrain-icon-192.png?v=52">
  <link rel="stylesheet" href="styles.css?v=80">
</head>
<body>
  <div class="app-shell" hidden aria-hidden="true">
    <header class="topbar">
      <button class="icon-button profile-logo" id="profileBtn" aria-label="Profil und Cloud-Status"><img src="moneybrain-icon-192.png?v=52" alt=""></button>
      <button class="icon-button" id="settingsBtn" aria-label="Einstellungen">⚙</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-route="home" class="active"><span>⌂</span>Übersicht</button>
      <button data-route="transactions"><span>≡</span>Buchung</button>
      <button data-route="money"><span>€</span>Geld</button>
      <button data-route="fixed-costs"><span>↻</span>Fixkosten</button>
      <button data-route="statistics"><span>▥</span>Statistik</button>
    </nav>
  </div>

  <dialog id="sheet"><div id="sheetContent"></div></dialog>
  <input id="fileInput" type="file" accept=".csv,.pdf,image/*" multiple hidden>
  <input id="backupInput" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status"></div>
  <section class="auth-overlay" id="authOverlay" hidden>
    <form class="auth-card" id="loginForm">
      <div class="brand auth-brand"><img src="moneybrain-icon-192.png?v=52" alt=""><span>money</span><strong>brain</strong></div>
      <span class="eyebrow">Geschuetzter Cloud-Speicher</span>
      <h1>Anmelden</h1>
      <p class="subtitle">Melde dich mit deinem persoenlichen Moneybrain-Konto an.</p>
      <div class="field"><label>E-Mail-Adresse</label><input name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Moneybrain-Passwort</label><input name="password" type="password" autocomplete="current-password" required></div>
      <p class="auth-error" id="authError" role="alert"></p>
      <button class="primary" type="submit">Sicher anmelden</button>
    </form>
  </section>
  <script src="vendor/tesseract.min.js"></script>
  <script src="statement-import.js?v=77"></script>
  <script src="receipt-import.js"></script>
  <script src="paypal-import.js?v=77"></script>
  <script src="supabase-config.js"></script>
  <script src="money-movements.js?v=77"></script>
  <script src="bank-import.js?v=77"></script>
  <script src="categories.js?v=78"></script>
  <script src="fixed-costs.js?v=78"></script>
  <script src="recurring-income.js?v=77"></script>
  <script src="cashflow.js?v=77"></script>
  <script src="notifications.js?v=77"></script>
  <script src="money-accounts.js?v=77"></script>
  <script src="cloud-sync.js?v=78"></script>
  <script src="app.js?v=80"></script>
</body>
</html>
