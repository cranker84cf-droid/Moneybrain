<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9">
  <title>Moneybrain</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="profileBtn" aria-label="Profil"><span>MB</span></button>
      <div class="brand"><span class="brand-dot"></span><strong>moneybrain</strong></div>
      <button class="icon-button" id="settingsBtn" aria-label="Einstellungen">⚙</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-route="home" class="active"><span>⌂</span>Übersicht</button>
      <button data-route="transactions"><span>≡</span>Buchungen</button>
      <button data-route="archive"><span>◷</span>Archiv</button>
    </nav>
  </div>

  <dialog id="sheet"><div id="sheetContent"></div></dialog>
  <input id="fileInput" type="file" accept=".csv,.pdf,image/*" multiple hidden>
  <div id="toast" role="status"></div>
  <script src="vendor/tesseract.min.js"></script>
  <script src="statement-import.js"></script>
  <script src="receipt-import.js"></script>
  <script src="paypal-import.js"></script>
  <script src="app.js"></script>
</body>
</html>
